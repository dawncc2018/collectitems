name: 每日定时执行任务

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-daily-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: 执行任务
        run: |
          python extract_links.py
      
      - name: 提交更新
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add merged_links.txt
          git commit -m 'Update merged links' || echo 'No changes to commit'
          git push
